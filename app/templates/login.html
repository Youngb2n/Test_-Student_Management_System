<!-- /app/templates/login.html-->
<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>로그인 | 교과과정인증정보시스템</title>

  <!-- ✅ request.url_for 사용: 경로 문제 해결 -->
  <link rel="stylesheet" href="{{ request.url_for('static', path='css/login.css') }}">
</head>
<body>
  <main class="card" role="main">
    <div class="brand" aria-label="브랜드">
      <div class="brand__logo" aria-hidden="true"></div>
      <div>
        <h1>교과과정인증정보시스템</h1>
        <p class="sub">역할을 선택하고 로그인하세요</p>
      </div>
    </div>

    <!-- 탭(라디오)은 role-toggle/폼보다 위에 있어야 CSS가 정상 동작 -->
    <input class="tab" type="radio" name="roleTab" id="tab-student" {% if active_role != 'admin' %}checked{% endif %}>
    <input class="tab" type="radio" name="roleTab" id="tab-admin"  {% if active_role == 'admin' %}checked{% endif %}>

    <div class="role-toggle" role="tablist" aria-label="로그인 역할 선택">
      <label role="tab" for="tab-student" aria-controls="student-panel" aria-selected="{{ 'true' if active_role != 'admin' else 'false' }}">Student</label>
      <label role="tab" for="tab-admin"  aria-controls="admin-panel"   aria-selected="{{ 'true' if active_role == 'admin' else 'false' }}">Admin</label>
    </div>

    {% if error %}
      <div class="alert alert--error" role="alert">
        {% if error == 'invalid_student' %}학생 이름/학번을 확인해 주세요.
        {% elif error == 'invalid_admin' %}관리자 아이디 또는 비밀번호가 올바르지 않습니다.
        {% elif error == 'invalid_role' %}잘못된 역할입니다.
        {% else %}로그인 처리 중 오류가 발생했습니다.{% endif %}
      </div>
    {% endif %}

    <!-- 학생 폼 -->
    <form class="form form--student" id="student-panel" method="post" action="/login" autocomplete="on">
      <input type="hidden" name="role" value="student" />
      <label for="name">이름</label>
      <input id="name" name="name" type="text" placeholder="예: 홍길동" required />

      <label for="student_no">학번</label>
      <input id="student_no" name="student_no" type="text" placeholder="20250001" required />

      <button class="btn" type="submit">로그인</button>
    </form>

    <!-- 관리자 폼 -->
    <form class="form form--admin" id="admin-panel" method="post" action="/login" autocomplete="off">
    <input type="hidden" name="role" value="admin" />
    <label for="uid_a">관리자 아이디</label>
    <input id="uid_a" name="username" type="text"
          placeholder="예: admin01"
          autocomplete="username"
          autocapitalize="off" spellcheck="false" required />

    <label for="pw_a">비밀번호</label>
    <input id="pw_a" name="password" type="password"
          placeholder="비밀번호"
          autocomplete="current-password"
          inputmode="text" required />

    <div class="row">
      <label class="inline"><input type="checkbox" name="remember" /> 로그인 상태 유지</label>
      <a href="#" class="link">관리자 계정 도움말</a>
    </div>

    <button class="btn" type="submit">로그인</button>
  </form>


  <!-- ✅ JS도 request.url_for로 변경 -->
  <script defer src="{{ request.url_for('static', path='js/login.js') }}"></script>
</body>
</html>
