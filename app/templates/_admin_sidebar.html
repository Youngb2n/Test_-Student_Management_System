<aside class="side" role="navigation" aria-label="관리자 사이드바">
  <div class="topbar">
    <div class="brand">관리자</div>
    <a
      class="home-pill {{ 'active' if active=='dashboard' else '' }}"
      href="/admin"
      title="홈(대시보드)"
      aria-label="홈(대시보드)"
    >
      홈
    </a>
  </div>

  <nav class="nav">
    <!-- 등록 섹션 -->
    <div
      class="menu-section {{ 'open' if active == 'register' else '' }}"
      data-section="register"
    >
      <button class="menu-header" type="button" onclick="toggleMenu(this)">
        <span>등록</span>
        <span class="arrow">▼</span>
      </button>

      <div class="submenu {{ 'open' if active == 'register' else '' }}">
        <a
          href="/admin/register/student"
          class="{% if request.url.path.startswith('/admin/register/student') %}active{% endif %}"
        >
          학생정보 등록
        </a>

        <a
          href="/admin/register/business"
          class="{% if request.url.path.startswith('/admin/register/business') %}active{% endif %}"
        >
          사업단 주관사업 등록
        </a>

        <a
          href="/admin/register/curriculum"
          class="{% if request.url.path.startswith('/admin/register/curriculum') %}active{% endif %}"
        >
          교육과정 등록
        </a>

        <a
          href="/admin/register/course"
          class="{% if request.url.path.startswith('/admin/register/course') %}active{% endif %}"
        >
          교과목 등록
        </a>

        <a
          href="/admin/register/extracurricular"
          class="{% if request.url.path.startswith('/admin/register/extracurricular') %}active{% endif %}"
        >
          비교과 프로그램 등록
        </a>
      </div>
    </div>

    <!-- 조회 섹션 -->
    <div
      class="menu-section {{ 'open' if active in ['view_students','view_business','view_curriculum','view_course','view_extracurricular'] else '' }}"
      data-section="view"
    >
      <button class="menu-header" type="button" onclick="toggleMenu(this)">
        <span>조회</span>
        <span class="arrow">▼</span>
      </button>

      <div class="submenu {{ 'open' if active in ['view_students','view_business','view_curriculum','view_course','view_extracurricular'] else '' }}">
        <a
          href="/admin/view/students"
          class="{% if request.url.path.startswith('/admin/view/students') %}active{% endif %}"
        >
          학생 조회
        </a>

        <a
          href="/admin/view/business"
          class="{% if request.url.path.startswith('/admin/view/business') %}active{% endif %}"
        >
          사업단 주관사업 조회
        </a>

        <a
          href="/admin/view/curriculum"
          class="{% if request.url.path.startswith('/admin/view/curriculum') %}active{% endif %}"
        >
          교육과정 조회
        </a>

        <a
          href="/admin/view/course"
          class="{% if request.url.path.startswith('/admin/view/course') %}active{% endif %}"
        >
          교과목 조회
        </a>

        <a
          href="/admin/view/extracurricular"
          class="{% if request.url.path.startswith('/admin/view/extracurricular') %}active{% endif %}"
        >
          비교과 프로그램 조회
        </a>
      </div>
    </div>

    <a href="/logout" class="logout">로그아웃</a>
  </nav>
</aside>

<script>
  // 기존에 쓰던 토글 스크립트 없으면 추가
  function toggleMenu(btn) {
    const section = btn.closest('.menu-section');
    section.classList.toggle('open');
    // submenu 열고 닫기
    const submenu = section.querySelector('.submenu');
    if (submenu) {
      submenu.classList.toggle('open');
    }
  }
</script>
